services:
  postgres:
    image: postgres:16-alpine
    container_name: trello-clone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-trello_clone}
      TZ: America/Sao_Paulo
    ports:
      # Vinculado a localhost: acessível só de dentro do VPS (ex.: drizzle-kit studio via SSH tunnel),
      # nunca exposto publicamente na interface externa.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
